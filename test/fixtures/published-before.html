<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apex template</title>
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
      main { padding: 24px; }
      .hero { width: 1328px; padding: 24px; box-sizing: border-box; background: #f2f2f2; }
      img { display: block; width: 320px; height: 180px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Apex</h1>
      <section class="hero">
        <p>A published page whose hero block is wider than the viewport.</p>
        <img src="http://127.0.0.1:9/missing-hero.png" alt="Hero" />
      </section>
    </main>
  </body>
</html>
