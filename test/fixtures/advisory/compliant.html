<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compliant pattern</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; color: #1a1a1a; background: #fff; }
  main { padding: 48px 64px; }
  .logos h2 { margin: 0 0 32px; font-size: 24px; text-align: center; }
  .logos .track { display: flex; gap: 48px; justify-content: center; }
  .logos svg { height: 32px; width: auto; }
</style>
</head>
<body>
<main>
  <section class="logos" aria-labelledby="logos-title">
    <h2 id="logos-title">Trusted by teams everywhere</h2>
    <div class="track">
      <svg role="img" aria-label="Northwind" viewBox="0 0 160 32"><text x="0" y="24" font-size="24" font-weight="700" fill="#1f3a5f">Northwind</text></svg>
      <svg role="img" aria-label="Lumen Labs" viewBox="0 0 160 32"><text x="0" y="24" font-size="24" font-style="italic" fill="#5b2a86">Lumen Labs</text></svg>
      <svg role="img" aria-label="Acre" viewBox="0 0 160 32"><text x="0" y="24" font-size="24" letter-spacing="4" fill="#20603d">ACRE</text></svg>
    </div>
  </section>
</main>
</body>
</html>
