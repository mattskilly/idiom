<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carousel cards</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; color: #1a1a1a; background: #fff; }
  main { padding: 48px 64px; }
  .carousel h2 { margin: 0; font-size: 32px; line-height: 1.2; }
  .carousel .track { display: flex; gap: 24px; margin-top: 0; }
  .card { flex: 1; border: 1px solid #d0d4da; border-radius: 12px; overflow: hidden; background: #fff; }
  .card .media { height: 160px; background: #c9d6e8; }
  .card h3 { margin: 16px 16px 8px; font-size: 20px; }
  .card p { margin: 0 16px 16px; font-size: 16px; color: #4a4f57; }
</style>
</head>
<body>
<main>
  <section class="carousel" aria-labelledby="carousel-title">
    <h2 id="carousel-title">Featured stories</h2>
    <div class="track">
      <article class="card"><div class="media"></div><h3>Launch week</h3><p>How the team shipped three products in five days.</p></article>
      <article class="card"><div class="media"></div><h3>Field notes</h3><p>What we learned visiting forty customers.</p></article>
      <article class="card"><div class="media"></div><h3>Design review</h3><p>A behind-the-scenes look at our critique ritual.</p></article>
    </div>
  </section>
</main>
</body>
</html>
