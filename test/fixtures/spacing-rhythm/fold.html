<!doctype html>
<html><head><style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; font: 14px/1.4 sans-serif; }
.shell { display: grid; grid-template-rows: 56px 1fr; height: 100vh; }
header { border-bottom: 1px solid #ccc; display: flex; align-items: center; padding: 0 16px; }
.drawer { overflow: auto; border-right: 1px solid #ccc; width: 320px; padding: 0 16px 16px; }
.tile-row { display: flex; gap: 8px; margin-top: 16px; }
.tile-row button { height: 96px; flex: 1; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
section.group { border-bottom: 1px solid #ddd; padding: 16px 0; }
section.group button { height: 32px; }
</style></head>
<body><div class="shell">
<header><button>Back</button></header>
<aside class="drawer">
  <div class="tile-row"><button>A</button><button>B</button></div>
  <div class="tile-row"><button>C</button><button>D</button></div>
  <div class="tile-row"><button>E</button><button>F</button></div>
  <div class="tile-row"><button>G</button><button>H</button></div>
  <div class="tile-row"><button>I</button><button>J</button></div>
  <div class="tile-row"><button>K</button><button>L</button></div>
  <div class="tile-row"><button>M</button><button>N</button></div>
</aside>
</div></body></html>
