<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Settings spacing rhythm</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px system-ui, sans-serif; }
      main { width: 420px; padding: 20px; }
      section { width: 100%; padding: 10px 12px 16px; }
      section.outlier { padding-bottom: 0; }
      button { display: block; width: 180px; height: 44px; }
      hr { width: 100%; height: 1px; margin: 0; border: 0; background: #777; }
    </style>
  </head>
  <body>
    <main class="settings">
      <section class="action-row"><button type="button">Rename calendar</button></section>
      <section class="action-row"><button type="button">Change colour</button></section>
      <section class="action-row"><button type="button">Share calendar</button></section>
      <section class="action-row outlier"><button type="button">Disconnect account</button></section>
      <hr>
    </main>
  </body>
</html>
