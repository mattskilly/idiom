<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>One icon, two meanings</title>
    <style>
      body { margin: 0; font: 16px system-ui, sans-serif; padding: 24px; color: #1d1d1f; background: #fff; }
      button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 32px; min-height: 32px; padding: 6px; border: 1px solid #c7c7cc; border-radius: 6px; background: #fff; color: inherit; font: inherit; cursor: pointer; }
      .toolbar { display: flex; gap: 12px; margin-bottom: 24px; }
      ul { list-style: none; padding: 0; }
      li { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
      a { display: inline-flex; align-items: center; gap: 6px; color: inherit; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button aria-label="Collapse panel" data-toggle="collapsed"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor"/><path d="M6 2.5v11M10 2.5v11" stroke="currentColor"/></svg></button>
      <button aria-label="3-column layout" data-toggle="three-columns"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor"/><path d="M6 2.5v11M10 2.5v11" stroke="currentColor"/></svg></button>
    </div>
    <p>Pick a layout for the board.</p>
    <script>
      for (const button of document.querySelectorAll("button[data-toggle]"))
        button.addEventListener("click", () => document.body.classList.toggle(button.dataset.toggle));
      for (const button of document.querySelectorAll("button[data-hide]"))
        button.addEventListener("click", () => document.getElementById(button.dataset.hide).classList.add("hidden"));
    </script>
  </body>
</html>
