<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Text swap</title>
    <style>
      body { margin: 0; font: 16px system-ui, sans-serif; padding: 24px; color: #1d1d1f; background: #fff; }
      button { font: inherit; display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid #c7c7cc; border-radius: 6px; background: #fff; color: inherit; cursor: pointer; }
      ul[hidden], section[hidden], aside[hidden] { display: none; }

    </style>
  </head>
  <body>
    <button id="details" aria-expanded="false" aria-controls="details-panel">Show details</button>
    <section id="details-panel" hidden><p>Orders ship within two working days.</p></section>
    <script>
      const trigger = document.getElementById("details");
      const panel = document.getElementById("details-panel");
      trigger.addEventListener("click", () => {
        const open = panel.hidden;
        panel.hidden = !open;
        trigger.setAttribute("aria-expanded", String(open));
        trigger.textContent = open ? "Hide details" : "Show details";
      });
    </script>
  </body>
</html>
