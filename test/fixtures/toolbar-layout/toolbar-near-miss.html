<!doctype html><meta charset="utf-8"><title>Toolbar near misses</title><style>
*{box-sizing:border-box}
body{margin:0;padding:32px;font:14px/1.2 system-ui,sans-serif;color:#1f2328;background:#fff}
section{margin:0 0 24px}
button{font:inherit;color:inherit;margin:0}
.bar{position:relative;display:flex;align-items:center;gap:4px;padding:4px;border:1px solid #d0d7de;border-radius:8px;width:max-content}
.tool{height:28px;padding:0 10px;border:0;border-radius:8px;background:#eef1f4}
.track{display:inline-flex;padding:2px;gap:2px;border-radius:6px;background:#d8dee4}
.track [role=radio]{height:24px;padding:0 8px;border:0;border-radius:4px;background:none}
.track [aria-checked=true]{background:#fff}
.tip{position:absolute;top:100%;left:0;padding:4px 8px;border-radius:4px;background:#1f2328;color:#fff}
.nudged{position:relative;top:1px}
.my-bar{display:flex;flex-wrap:wrap;gap:4px;width:120px}
.my-bar button{width:50px;height:28px;border:0;border-radius:8px;background:#eef1f4}
.vertical{flex-direction:column;align-items:flex-start}
.vertical .tall{height:44px}
</style>
<section>
<div class="bar" role="toolbar" aria-label="Format">
<button class="tool">Bold</button>
<button class="tool">Italic</button>
<div class="track" role="radiogroup" aria-label="Alignment"><button role="radio" aria-checked="true">Left</button><button role="radio" aria-checked="false">Right</button></div>
<button class="tool">Link</button>
<span class="tip" role="tooltip">Formatting</span>
</div>
</section>
<section>
<div class="bar" role="toolbar" aria-label="History">
<button class="tool">Undo</button>
<button class="tool nudged">Redo</button>
<button class="tool">Clear</button>
</div>
</section>
<section>
<div class="my-bar"><button>One</button><button>Two</button><button>Three</button></div>
</section>
<section>
<div class="bar vertical" role="toolbar" aria-orientation="vertical" aria-label="Layers">
<button class="tool">Up</button>
<button class="tool tall">Down</button>
<button class="tool">Hide</button>
</div>
</section>
