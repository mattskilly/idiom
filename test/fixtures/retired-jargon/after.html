<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Editor</title>
<style>body {font:16px/1.5 system-ui;padding:24px} button {font:inherit;padding:8px 16px} section {margin:16px 0}</style></head>
<body><main>
<section aria-label="History"><h2>History</h2>
<button id="history" aria-label="Brand: primary colour" title="Brand: primary colour">Brand: primary colour</button>
<p id="history-case">Brand: secondary colour</p></section>
<section aria-label="Advanced"><h2>Advanced</h2>
<button id="follow" aria-label="Follow brand" title="Follow brand">Follow brand</button>
<p id="highlight">No items available to highlight</p><p id="inherited">From brand</p>
<p id="multiple">Brand items</p><p id="canadian">Organize items</p></section>
<section aria-label="Add"><h2>Add</h2>
<button id="disclosure" aria-label="Expand" title="Expand">Expand</button>
<button id="language" aria-label="English" title="English">English</button><p id="colors">Colours</p></section>
</main></body></html>
