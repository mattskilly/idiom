<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Editor</title>
<style>body {font:16px/1.5 system-ui;padding:24px} button {font:inherit;padding:8px 16px} section {margin:16px 0}</style></head>
<body><main>
<section aria-label="History"><h2>History</h2>
<button id="history" aria-label="Style guide: primary colour" title="Style guide: primary colour">Style guide: primary colour</button>
<p id="history-case">STYLE GUIDE: secondary colour</p></section>
<section aria-label="Advanced"><h2>Advanced</h2>
<button id="follow" aria-label="Follow guide" title="Follow guide">Follow guide</button>
<p id="highlight">No nodes available to highlight</p><p id="inherited">Inherited</p>
<p id="multiple">Style guide nodes</p><p id="canadian">Organize items</p></section>
<section aria-label="Add"><h2>Add</h2>
<button id="disclosure" aria-label="Disclosure" title="Disclosure">Disclosure</button>
<button id="language" aria-label="en" title="en">en</button><p id="colors">Colors</p></section>
</main></body></html>
