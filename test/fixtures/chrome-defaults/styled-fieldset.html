<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1d1d1b; }
  main { padding: 32px; }
  fieldset.plain { border: 0; padding: 0; margin: 0 0 24px; }
  fieldset.plain legend { padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
  fieldset.floated { border: 1px solid #d6dbe1; border-radius: 8px; padding: 12px; }
  fieldset.floated legend { float: left; width: 100%; padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Settings</h1>
  <fieldset class="plain">
    <legend>Notifications</legend>
    <label><input type="checkbox"> Email</label>
  </fieldset>
  <fieldset class="floated">
    <legend>Privacy</legend>
    <label><input type="checkbox"> Share usage data</label>
  </fieldset>
</main>
</body>
</html>
