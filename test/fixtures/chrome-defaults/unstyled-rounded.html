<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unstyled scroller in a rounded panel</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #f4f4f2; }
  main { padding: 32px; }
  .panel { width: 320px; border-radius: 12px; background: #fff; overflow: hidden; }
  .panel h2 { margin: 0; padding: 12px 16px; font-size: 16px; }
  .panel-body { height: 160px; overflow: auto; padding: 0 16px; }
  .panel-body p { margin: 0 0 12px; }
</style>
</head>
<body>
<main>
  <h1>Activity</h1>
  <section class="panel">
    <h2>Today</h2>
    <div class="panel-body">
      <p>Ana commented on the budget draft.</p>
      <p>Ravi uploaded three files.</p>
      <p>The launch checklist was approved.</p>
      <p>Mina joined the design channel.</p>
      <p>The offsite agenda changed.</p>
      <p>Two invoices were paid.</p>
      <p>The roadmap moved to review.</p>
    </div>
  </section>
</main>
</body>
</html>
