<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comment box</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #f4f4f2; }
  main { padding: 32px; }
  label { display: block; margin-bottom: 8px; }
  textarea { width: 320px; height: 96px; border: 1px solid #c8c8c4; border-radius: 10px;
    background: #fff; padding: 8px 12px; font: inherit; resize: none; }
</style>
</head>
<body>
<main>
  <h1>Leave a comment</h1>
  <label for="comment">Comment</label>
  <textarea id="comment">Looks good to me.</textarea>
</main>
</body>
</html>
