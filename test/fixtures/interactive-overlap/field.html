<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field — an input group's shared border beside controls that really overlap</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; font: 16px/1.5 Arial, sans-serif; color: #212529; background: #fff; }
form { margin-bottom: 32px; }
.input-group { position: relative; display: flex; flex-wrap: wrap; align-items: stretch; width: 100%; }
.form-control { position: relative; flex: 1 1 auto; width: 1%; min-width: 0; padding: 6px 12px; font: inherit; border: 1px solid #dee2e6; border-radius: 6px; background: #fff; }
.btn { position: relative; padding: 6px 12px; font: inherit; color: #fff; border: 1px solid #6c757d; border-radius: 6px; background: #6c757d; }
.input-group > :not(:last-child) { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.input-group > :not(:first-child) { margin-left: -1px; border-top-left-radius: 0; border-bottom-left-radius: 0; }
.stolen { display: flex; }
.stolen input { flex: 1 1 auto; min-width: 0; padding: 6px 12px; font: inherit; border: 1px solid #dee2e6; border-radius: 6px; }
.stolen button { margin-left: -12px; padding: 6px 12px; font: inherit; border: 1px solid #6c757d; border-radius: 6px; background: #6c757d; color: #fff; }
.pills { display: flex; }
.pills button { padding: 6px 16px; font: inherit; border: 1px solid #6c757d; border-radius: 999px; background: #fff; }
.pills button + button { margin-left: -1px; }
</style>
</head>
<body>
<form class="card p-2" id="promo-form">
  <div class="input-group">
    <input type="text" class="form-control" id="promo-code" placeholder="Promo code">
    <button type="submit" class="btn btn-secondary" id="redeem">Redeem</button>
  </div>
</form>
<form class="stolen" id="stolen-form">
  <input type="email" id="stolen-email" placeholder="Email">
  <button type="submit" id="stolen-submit">Join</button>
</form>
<div class="pills" id="pills">
  <button type="button" id="pill-day">Day</button><button type="button" id="pill-week">Week</button>
</div>
</body>
</html>
