<!doctype html>
<html lang="en">
  <head>
    <title>Brand kit</title>
    <style>
      body { font: 16px/1.4 system-ui, sans-serif; margin: 32px; color: #222; }
      ul { margin: 0; padding: 0; list-style: none; }
      fieldset { border: 1px solid #ccc; }
    </style>
  </head>
  <body>
    <nav><ul><li><a href="#">Home</a></li><li><a href="#">Kits</a></li></ul></nav>
    <h2>Fonts</h2>
    <ul id="fonts"></ul>
    <table id="assets">
      <caption>Assets</caption>
      <thead><tr><th>Name</th></tr></thead>
      <tbody><tr><td>logo.svg</td></tr><tr><td>mark.svg</td></tr></tbody>
    </table>
    <fieldset id="palette">
      <legend>Palette</legend>
      <button type="button">Add colour</button>
    </fieldset>
    <section id="tags" aria-label="Tags">
      <span class="tag" style="border: 1px solid #999">Bold</span>
      <button type="button">+ New tag</button>
    </section>
  </body>
</html>
