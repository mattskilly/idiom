<!doctype html>
<html lang="en">
  <head>
    <title>Card</title>
    <style>
      body { font: 16px/1.4 system-ui, sans-serif; margin: 32px; color: #222; }
      .card { border: 1px solid #ccc; border-radius: 12px; padding: 16px; max-width: 320px; }
      label { display: block; margin-bottom: 4px; }
      input { border: 1px solid #888; border-radius: 4px; padding: 8px; width: 100%; box-sizing: border-box; font: inherit; }
    </style>
  </head>
  <body>
    <h1>Profile</h1>
    <div class="card">
      <label for="name">Name</label>
      <input id="name" value="Ada" />
    </div>
  </body>
</html>
