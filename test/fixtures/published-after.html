<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apex template</title>
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
      main { padding: 24px; }
      .hero { width: 1328px; max-width: 100%; padding: 24px; box-sizing: border-box; background: #f2f2f2; }
      img { display: block; width: 320px; height: 180px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Apex</h1>
      <section class="hero">
        <p>A published page whose hero block is wider than the viewport.</p>
        <img src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22320%22 height=%22180%22%3E%3Crect width=%22320%22 height=%22180%22 fill=%22%23cccccc%22/%3E%3C/svg%3E" alt="Hero" />
      </section>
    </main>
  </body>
</html>
