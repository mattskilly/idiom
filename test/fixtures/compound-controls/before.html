<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Styles panel</title>
<style>
* { box-sizing: border-box; } body { margin: 0; font: 13px/1.4 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
.styles { width: 280px; padding: 16px; }
.group-label { display: block; font-weight: 600; margin: 0 0 8px; }
.row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.row > label { width: 56px; }
.field { position: relative; width: 112px; }
.field input { width: 100%; height: 32px; padding: 0 8px; border: 1px solid #999; border-radius: 4px; font: inherit; }
.suffix { position: absolute; right: 0; top: 8px; font-size: 12px; line-height: 16px; color: #555; }
.row select { width: 64px; height: 32px; border: 1px solid #999; border-radius: 4px; font: inherit; }
.ok .field input { padding-right: 28px; }
.ok .suffix { right: 8px; }
</style>
<section class="styles" aria-label="Styles">
  <div class="size" role="group" aria-labelledby="size-label">
    <span class="group-label" id="size-label">Size</span>
    <div class="row">
      <label for="width">Width</label>
      <div class="field"><input id="width" type="number" aria-label="Width" value="320"><span class="suffix">px</span></div>
      <select id="width-unit" aria-label="Width unit"><option selected>px</option><option>%</option><option>auto</option></select>
    </div>
    <div class="row">
      <label for="height">Height</label>
      <div class="field"><input id="height" type="number" aria-label="Height" value="240"><span class="suffix">px</span></div>
      <select id="height-unit" aria-label="Height unit"><option selected>px</option><option>%</option><option>auto</option></select>
    </div>
  </div>
  <div class="row">
    <label for="font-size">Type</label>
    <select id="font-size" aria-label="Type size"><option>Small</option><option selected>Medium</option><option>Large</option></select>
  </div>
  <div class="row ok">
    <label for="opacity">Opacity</label>
    <div class="field"><input id="opacity" type="number" aria-label="Opacity" value="100"><span class="suffix">%</span></div>
  </div>
</section>
</html>
