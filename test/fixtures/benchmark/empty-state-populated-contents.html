<!doctype html><html lang="en"><title>Populated regions with boxless items</title><style>/*CSS*/ main,ul,[role=grid],[role=feed]{min-height:80px;width:400px}.contents{display:contents}</style><body>
<main id="canvas"><div class="block contents"><span class="contents"><p>Actual canvas content</p></span></div></main>
<ul id="list"><li class="contents">Actual list content</li></ul>
<div id="grid" role="grid"><div role="row" class="contents"><span role="gridcell">Actual row content</span></div></div>
<div id="feed" role="feed"><article class="contents"><svg width="24" height="24" aria-label="Item image"><rect width="24" height="24" fill="blue"/></svg></article></div>
</body></html>
