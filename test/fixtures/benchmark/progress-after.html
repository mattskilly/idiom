<!doctype html><html lang="en"><title>Generate</title><style>@keyframes spin{to{transform:rotate(360deg)}}.spinner{display:inline-block;width:20px;height:20px;animation:spin 1s linear infinite}</style><body><main id="panel"><p id="ai-status" role="status">AI ready</p><button id="generate">Generate</button><div id="result"></div></main><script>
document.querySelector('#generate').onclick=()=>{document.querySelector('#panel').setAttribute('aria-busy','true');document.querySelector('#ai-status').textContent='Generating…';const spinner=document.createElement('span');spinner.className='spinner';document.querySelector('#panel').append(spinner);setTimeout(()=>{document.querySelector('#panel').removeAttribute('aria-busy');spinner.remove();document.querySelector('#result').textContent='Result';},1500);};
</script></body></html>
