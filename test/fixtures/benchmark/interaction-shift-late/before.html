<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Directory</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1d1d1f; }
  main { max-width: 720px; margin: 0 auto; padding: 24px; }
  ul.results { margin: 0; padding: 0; list-style: none; }
  ul.results li { box-sizing: border-box; height: 40px; padding: 8px 0; border-bottom: 1px solid #eee; }
  .note { color: #555; }
  footer { max-width: 720px; margin: 0 auto; padding: 24px; color: #555; }
</style>
</head>
<body>
<main>
  <h1>People</h1>
  <button id="load" type="button">Load results</button>
  <section id="results" aria-live="polite"></section>
  <p class="note">The directory updates every hour.</p>
</main>
<footer>Contact the directory team to correct an entry.</footer>
<script>
  document.getElementById("load").addEventListener("click", async () => {
    const response = await fetch("/results");
    const people = await response.json();
    const list = document.createElement("ul");
    list.className = "results";
    for (const person of people) {
      const item = document.createElement("li");
      item.textContent = person;
      list.append(item);
    }
    document.getElementById("results").replaceChildren(list);
  });
</script>
</body>
</html>
