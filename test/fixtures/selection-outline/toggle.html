<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page editor</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; color: #111827; }
      .block { position: relative; display: flex; align-items: center; gap: 16px; box-sizing: border-box; width: 600px; height: 64px; margin: 40px; padding: 0 16px; background: #f9fafb; }
      #other { position: absolute; left: 700px; top: 0; width: 300px; }
      .trigger { font: inherit; padding: 6px 12px; }
      #menu { position: absolute; left: 100px; top: 40px; z-index: 10; width: 200px; height: 160px; margin: 0; padding: 8px 0; box-sizing: border-box; list-style: none; background: #fff; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); }
      #menu li { padding: 8px 16px; }
      .frame { position: absolute; z-index: 50; pointer-events: none; box-sizing: border-box; border: 2px solid #2563eb; }
    </style>
  </head>
  <body>
    <nav id="block" class="block" aria-label="Navigation block">
      <button class="trigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">Products</button>
      <ul id="menu" role="menu" hidden>
        <li role="menuitem">Analytics</li>
        <li role="menuitem">Automation</li>
        <li role="menuitem">Reports</li>
      </ul>
    </nav>
    <div id="frame" class="frame" style="left: 40px; top: 40px; width: 600px; height: 64px"></div>
    <script>
      {
        const trigger = document.querySelector(".trigger");
        const menu = document.getElementById("menu");
        trigger.addEventListener("click", () => {
          const open = trigger.getAttribute("aria-expanded") !== "true";
          trigger.setAttribute("aria-expanded", String(open));
          menu.hidden = !open;
        });
      }
    </script>
  </body>
</html>
