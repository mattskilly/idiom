<!doctype html><html lang="en"><head><title>Action fixture</title><style>
body { margin: 40px; background: white; color: #172331; font: 16px sans-serif; }
.target-row { display:flex; align-items:center; gap:4px; }
button { margin: 32px; border: 0; padding: 0; background: #172331; color: white; width: 12px; height: 12px; }
</style></head><body><header><button id="show" style="width:120px;height:44px">Show notice</button></header><main><h1>Review</h1><div class="target-row"><button style="margin-right:0" id="existing" aria-label="Existing action">Go</button><button aria-label="Neighbor existing" style="width:44px;height:44px;margin-left:0">Next</button></div><div class="target-row"><button style="margin-right:0" id="regression" aria-label="Added action">Go</button><button aria-label="Neighbor regression" style="width:44px;height:44px;margin-left:0">Next</button></div></main><script>document.getElementById('show').onclick = () => { const notice = document.createElement('div'); notice.style.cssText = 'height:96px;background:#eee'; notice.textContent = 'Your orders are up to date.'; document.body.insertBefore(notice, document.body.firstChild); };</script></body></html>
