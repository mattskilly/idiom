<!doctype html>
<html lang="en">
  <head>
    <title>Studio</title>
    <style>
      body { color: #182030; background: #fff; font: 16px sans-serif; margin: 32px; }
      @media (prefers-color-scheme: dark) {
        body { color: #e8ecf4; background: #10141c; }
      }
      main { width: 300px; }
      .toolbar { display: flex; gap: 16px; align-items: center; }
      .toolbar h1 { font-size: 20px; margin: 0; flex: 1; }
      .icon-button {
        width: 24px; height: 24px; padding: 0; border: 0;
        background: transparent; color: inherit; display: inline-grid; place-items: center;
      }
      .icon-button svg { width: 16px; height: 16px; }
    </style>
  </head>
  <body>
    <main>
      <div class="toolbar" role="toolbar" aria-label="Panel">
        <h1>Studio</h1>
        <button type="button" class="icon-button" aria-label="Close panel" title="Close">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" /></svg>
        </button>
      </div>
      <p id="required">Required content</p>
    </main>
  </body>
</html>
