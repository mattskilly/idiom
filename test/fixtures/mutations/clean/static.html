<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Workspace</title><style>
*{box-sizing:border-box}body{font:16px/1.5 system-ui;margin:0;color:#18202b;background:white}main{padding:24px;max-width:700px}h1{margin:0 0 24px}p{margin:24px 0}button,input{font:inherit;color:inherit;background:#fff;border:1px solid #667085;border-radius:8px;height:48px;padding:8px 16px}button{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}#pair{display:flex;gap:16px;margin:24px 0}#query{width:160px}#icon{width:48px;padding:8px;margin-left:24px}button:focus-visible,input:focus-visible{outline:2px solid #2244aa;outline-offset:2px}#status{min-height:48px}
</style></head><body><main><h1>Workspace</h1><p id="copy">Your workspace is ready for the next project.</p><button id="action">Preview</button><button id="icon" aria-label="Show information" title="Show information"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor"/><path d="M12 10v7m0-11v2" stroke="currentColor"/></svg></button><div id="pair"><input id="query" aria-label="Project name" value="Draft"><button id="search">Search</button></div><p id="status" role="status">Choose an action to continue.</p></main><script>
for(const id of ['action','icon','search'])document.getElementById(id).addEventListener('click',()=>{document.getElementById('status').textContent=id==='action'?'The preview is ready.':id==='icon'?'Workspace information is available.':'Search is complete.'});
</script></body></html>
