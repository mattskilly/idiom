<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Items</title><style>body{font:16px/1.5 system-ui;margin:24px;color:#18202b;background:white}button{font:inherit;min-height:48px;padding:8px 16px}#pending{visibility:hidden;min-height:48px}#pending.active{visibility:visible}#list{min-height:120px}</style></head><body><main><h1>Items</h1><button id="load">Load items</button><p id="pending" role="status">Loading items…</p><ul id="list"></ul></main><script>
load.addEventListener('click',async()=>{pending.classList.add('active');try{const response=await fetch('/api/items');const items=await response.json();list.replaceChildren(...items.map(text=>{const li=document.createElement('li');li.textContent=text;return li}));}finally{pending.classList.remove('active')}});
</script></body></html>
