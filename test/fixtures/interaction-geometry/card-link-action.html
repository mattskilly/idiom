<!doctype html>
<title>A card whose corner action is itself a link</title>
<style>
  body { margin: 24px; font: 16px Arial; }
  .card { position: relative; width: 240px; height: 200px; }
  a.main { display: block; width: 240px; height: 200px; background: #eee; }
  .abs { position: absolute; top: 4px; right: 4px; width: 40px; height: 40px; }
</style>
<div class="card"><a class="main" href="/x" id="feature">Feature</a><a class="abs" href="/edit" id="more">Edit</a></div>
