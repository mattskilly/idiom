<!doctype html><style>body{font:16px Arial;padding:30px}.pair{display:flex;margin-bottom:40px;width:max-content}button,.menu{box-sizing:border-box;border:1px solid black;border-radius:8px;background:white;padding:12px;width:140px;height:48px}.menu{display:block}</style>
<div class=pair><button id=closed aria-expanded=false aria-controls="closed-menu other">More actions</button><div class=menu id=closed-menu><span>Closed menu</span></div></div>
<div id=other></div><div class=pair><button id=open aria-expanded=true aria-controls=open-menu>More actions</button><div class=menu id=open-menu>Open menu</div></div>
<div class=pair><button id=faded>More actions</button><div class=menu id=faded-menu style="opacity:0">Faded menu</div></div>
<div class=pair style="transform:translateX(-2000px)"><button id=offscreen>More actions</button><div class=menu id=offscreen-menu>Offscreen menu</div></div>
