<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #1d232b; background: #fff; display: flex; }
  .rail { width: 56px; border-right: 1px solid #d6dbe1; display: flex; flex-direction: column; align-items: center; padding: 8px 0; }
  .rail ul { list-style: none; margin: 0; padding: 0; }
  .rail-item { position: relative; width: 56px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #1d232b; text-decoration: none; }
  .rail-item .label { font-size: 10px; }
  .rail-item .icon-wrap { position: relative; width: 24px; height: 24px; }
  .rail-item .ext { position: absolute; top: -3px; right: -3px; background: #fff; }
  main { padding: 24px; flex: 1; }
  .rail-item .side { display: inline-block; vertical-align: middle; margin-left: 2px; }
  .bell { position: relative; width: 40px; height: 40px; border: 0; background: none; padding: 8px; }
  .bell .count { position: absolute; top: 4px; right: 4px; min-width: 14px; height: 14px; border-radius: 7px; background: #c62828; color: #fff; font-size: 10px; line-height: 14px; text-align: center; }
</style>
</head>
<body>
<nav class="rail" aria-label="Workspace">
  <a class="rail-item" href="/home"><span class="icon-wrap"><svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></svg></span><span class="label">Home<svg class="side" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M3 1h6v6 M9 1L4 6" stroke="currentColor" fill="none"/></svg></span></a>
  <a class="rail-item" href="/inbox"><span class="icon-wrap"><svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h18v14H3z M3 13h5l2 3h4l2-3h5"/></svg></span><span class="label">Inbox</span></a>
  <a class="rail-item" href="/reports"><span class="icon-wrap"><svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 20V10 M12 20V4 M19 20v-7"/></svg></span><span class="label">Reports<svg class="side" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M3 1h6v6 M9 1L4 6" stroke="currentColor" fill="none"/></svg></span></a>
  <a class="rail-item" href="/team"><span class="icon-wrap"><svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6"/></svg></span><span class="label">Team</span></a>
  <a class="rail-item" href="/files"><span class="icon-wrap"><svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3h8l4 4v14H6z"/></svg></span><span class="label">Files<svg class="side" viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M3 1h6v6 M9 1L4 6" stroke="currentColor" fill="none"/></svg></span></a>
  <a class="rail-item" href="/settings"><span class="icon-wrap"><svg class="nav-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3 M12 19v3 M2 12h3 M19 12h3"/></svg></span><span class="label">Settings</span></a>
</nav>
<main><h1>Workspace</h1><button class="bell" type="button" aria-label="Notifications, 3 unread"><svg class="bell-icon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z M10 21h4"/></svg><span class="count">3</span></button><p>Pick a section from the rail.</p></main>
</body>
</html>
