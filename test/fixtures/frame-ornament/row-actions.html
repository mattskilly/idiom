<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Commands</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #1d232b; background: #fff; padding: 24px; }
  ol { list-style: none; padding: 0; width: 560px; }
  li { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px dashed #d6dbe1; }
  code { flex: 1; font-family: ui-monospace, monospace; }
  .copy { width: 28px; height: 28px; border: 0; background: none; padding: 6px; }
</style>
</head>
<body>
  <h1>Getting started</h1>
  <ol aria-label="First run">
    <li><code>tool init</code><button class="copy" type="button" aria-label="Copy command"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="5" y="5" width="8" height="8" fill="none" stroke="currentColor"/></svg></button></li>
    <li><code>tool add page</code><button class="copy" type="button" aria-label="Copy command"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="5" y="5" width="8" height="8" fill="none" stroke="currentColor"/></svg></button></li>
    <li><code>tool check</code><button class="copy" type="button" aria-label="Copy command"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="5" y="5" width="8" height="8" fill="none" stroke="currentColor"/></svg></button></li>
    <li><code>tool check --changed</code><button class="copy" type="button" aria-label="Copy command"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="5" y="5" width="8" height="8" fill="none" stroke="currentColor"/></svg></button></li>
    <li><code>tool fix</code><button class="copy" type="button" aria-label="Copy command"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="5" y="5" width="8" height="8" fill="none" stroke="currentColor"/></svg></button></li>
    <li><code>tool publish</code><button class="copy" type="button" aria-label="Copy command"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="5" y="5" width="8" height="8" fill="none" stroke="currentColor"/></svg></button></li>
  </ol>
</body>
</html>
