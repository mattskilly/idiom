<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1d232b; background: #fff; }
  .spacer { height: 64px; }
  .gap { height: 48px; width: 320px; background: #fff; }
  .panel { background: #f4f6f8; padding: 24px; }
  .inset { height: 40px; background: #f4f6f8; }
</style>
</head>
<body>
  <h1>Settings</h1>
  <div class="spacer"></div>
  <p>Notification preferences are saved per device.</p>
  <div class="gap"></div>
  <section class="panel">
    <h2>Account</h2>
    <div class="inset"></div>
    <p>Signed in as the workspace owner.</p>
  </section>
</body>
</html>
