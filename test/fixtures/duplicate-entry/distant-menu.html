<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Editor</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; }
  header, footer { padding: 12px; }
  main { padding: 24px; min-height: 600px; }
  [role=toolbar] { display: flex; gap: 4px; align-items: center; position: relative; }
  button { min-width: 32px; min-height: 32px; transition: none; }
  [role=menu] { position: absolute; top: 36px; left: 0; display: flex; flex-direction: column; background: #fff; border: 1px solid #ccc; padding: 4px; z-index: 1; }
  [role=menu][hidden] { display: none; }
  .anchor { position: relative; }
</style></head>
<body>
<header>
  <div role="toolbar" aria-label="Edit">
    <button id="actions" aria-haspopup="menu" aria-expanded="false" onclick="toggle(this, 'header-menu')">Actions</button>
    <div role="menu" id="header-menu" aria-label="Actions" hidden>
      <button role="menuitem" onclick="closeAll()">Cut</button>
      <button role="menuitem" onclick="closeAll()">Copy</button>
      <button role="menuitem" onclick="closeAll()">Paste</button>
    </div>
  </div>
</header>
<main>
  <h1>Document</h1>
  <div role="toolbar" aria-label="Text">
    <button id="format" aria-haspopup="menu" aria-expanded="false" onclick="toggle(this, 'format-menu')">Format</button>
    <button id="style" aria-haspopup="menu" aria-expanded="false" onclick="toggle(this, 'style-menu')">Style</button>
    <div role="menu" id="format-menu" aria-label="Format" hidden>
      <button role="menuitem" onclick="closeAll()">Bold</button>
      <button role="menuitem" onclick="closeAll()">Italic</button>
      <button role="menuitem" onclick="closeAll()">Underline</button>
    </div>
    <div role="menu" id="style-menu" aria-label="Style" hidden>
      <button role="menuitem" onclick="closeAll()">Bold</button>
      <button role="menuitem" onclick="closeAll()">Italic</button>
      <button role="menuitem" onclick="closeAll()">Strikethrough</button>
    </div>
  </div>
</main>
<footer>
  <div class="anchor">
    <button id="clipboard" aria-haspopup="menu" aria-expanded="false" onclick="toggle(this, 'footer-menu')">Clipboard</button>
    <div role="menu" id="footer-menu" aria-label="Clipboard" hidden>
      <button role="menuitem" onclick="closeAll()">Cut</button>
      <button role="menuitem" onclick="closeAll()">Copy</button>
      <button role="menuitem" onclick="closeAll()">Paste</button>
    </div>
  </div>
</footer>
<script>
  function closeAll() {
    for (const menu of document.querySelectorAll('[role=menu]')) menu.hidden = true;
    for (const button of document.querySelectorAll('[aria-haspopup]')) button.setAttribute('aria-expanded', 'false');
  }
  function toggle(trigger, id) {
    const menu = document.getElementById(id);
    const open = menu.hidden;
    closeAll();
    menu.hidden = !open;
    trigger.setAttribute('aria-expanded', String(open));
  }
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeAll(); });
</script>
</body></html>
