<!doctype html>
<html lang="en">

<title>Override indicators</title>
<style>
  .bp-override-dot { display: inline-block; box-sizing: border-box; border-radius: 50%; background: #7050b0; }
  .oversize { width: 12px; height: 12px; }
  .subpixel { width: 8.5px; height: 8.5px; }
</style>
<main>

  <p>Features <span class="bp-override-dot oversize" title="Tablet override"></span></p>
  <p>Footer <span class="bp-override-dot subpixel" title="Mobile override"></span></p>
</main>
</html>
