<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goals</title>
<style>
  body { margin: 0; padding: 24px; font: 16px/1.5 system-ui, sans-serif; color: #1f2933; background: #fff; }
  [role="tablist"] { display: flex; gap: 8px; border-bottom: 1px solid #e4e4e0; margin-bottom: 24px; }
  [role="tab"] { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border: 0; background: none; font: inherit; color: #3e4c59; cursor: pointer; }
  [role="tab"][aria-selected="true"] { color: #1f2933; box-shadow: inset 0 -2px 0 #2563eb; }
  .field { display: grid; gap: 4px; max-width: 320px; margin-bottom: 24px; }
  input { height: 36px; padding: 0 8px; border: 1px solid #c81e1e; border-radius: 6px; font: inherit; }
  .error { display: flex; gap: 4px; align-items: center; margin: 0; color: #c81e1e; font-size: 14px; }
  .goal { display: flex; align-items: center; justify-content: space-between; max-width: 480px; padding: 12px 0; border-top: 1px solid #e4e4e0; }
  .delete { display: inline-grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 6px; background: none; cursor: pointer; }
</style>
</head>
<body>
  <div role="tablist" aria-label="Sections">
    <button id="tab-overview" role="tab" aria-selected="true">Overview</button>
    <button id="tab-goals" role="tab" aria-selected="false"><svg class="tab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#9aa5b1" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="5"/></svg> Goals</button>
    <button id="tab-habits" role="tab" aria-selected="false"><svg id="habits-mark" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5" fill="#9aa5b1"/></svg> Habits</button>
    <button id="tab-streaks" role="tab" aria-selected="false"><svg id="streaks-dot" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5" fill="#9aa5b1"/></svg> Streaks</button>
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input id="email" type="email" aria-invalid="true" aria-describedby="email-error">
    <p id="email-error" class="error"><span id="email-error-icon" aria-hidden="true">⚠</span> Email is required</p>
  </div>
  <div class="goal" id="goal-row">
    <span>Run 20km this week</span>
    <button class="delete" id="delete-goal" aria-label="Delete goal"><svg id="trash" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#dc2626" stroke-width="1.5" aria-hidden="true"><path d="M3 5h12M7 5V3h4v2M5 5l1 10h6l1-10"/></svg></button>
  </div>
</body>
</html>
