<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Hosted measurement fixture</title><style>
body{font:18px/1.5 system-ui;margin:24px;background:#fafaf8;color:#111;max-width:900px}h1{font-size:40px}button{font:inherit;background:#111;color:#fff;padding:12px 20px}img{max-width:100%;width:240px;height:160px;object-fit:cover}#images{display:flex;flex-wrap:wrap;gap:16px}.panel{padding:24px;background:#eee}#result{min-height:80px}@media(max-width:600px){h1{font-size:32px}}.bad{font-size:10px;color:#bbb}
</style></head><body><main><h1>Plan your next project</h1><p>A representative public page with content, images and an interactive panel.</p><p class="bad">A deliberately low-contrast label.</p><div class="panel"><button id="show" aria-expanded="false">Show details</button><div id="result" hidden>Details are ready. <a href="#footer">Read more</a></div></div><div id="images"></div><footer id="footer">Measurement fixture · no external services</footer></main><script>
const variant=new URL(location.href).pathname;
if(variant.includes('interactive'))document.querySelector('#show').onclick=()=>{document.querySelector('#result').hidden=false;document.querySelector('#show').setAttribute('aria-expanded','true')};
if(variant.includes('images'))for(let i=0;i<12;i++){const img=new Image();img.src='/sample.png?'+i;img.alt='Sample project '+i;document.querySelector('#images').append(img)}
if(variant.includes('large')){const c=document.createElement('canvas');c.width=1440;c.height=5000;document.body.append(c);const x=c.getContext('2d');const p=x.createImageData(c.width,c.height);let s=123456789;for(let i=0;i<p.data.length;i+=4){s=(Math.imul(s,1664525)+1013904223)>>>0;p.data[i]=s&255;p.data[i+1]=(s>>>8)&255;p.data[i+2]=(s>>>16)&255;p.data[i+3]=255}x.putImageData(p,0,0)}
</script></body></html>
