<!doctype html><html lang="en"><title>Native title</title><body>
<!-- A glyph control explained by a native title: the browser shows it on hover after a delay. -->
<main><h1>Layers</h1>
<button id="titled" aria-label="Keyboard shortcuts" title="Keyboard shortcuts">?</button>
<button id="named" aria-label="Layer help">?</button>
</main></body></html>
