<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>First-run sample</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        font-family: system-ui, sans-serif;
        background: #ffffff;
        color: #111111;
      }
      .faint {
        color: #b5b5b5;
        font-size: 14px;
      }
      .icon {
        border: 1px solid #cccccc;
        background: #ffffff;
        padding: 8px;
      }
      .tiny {
        display: inline-block;
        width: 16px;
        height: 16px;
        line-height: 16px;
        font-size: 10px;
        text-align: center;
        background: #eeeeee;
        color: #111111;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Plan your week</h1>
      <p class="faint">
        Pick the days that suit you and we will hold them until Friday.
      </p>
      <button class="icon" type="button">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2 8h12M8 2v12" stroke="#111111" stroke-width="2" />
        </svg>
      </button>
      <p>Need a hand? <a class="tiny" href="#help">?</a></p>
      <p id="help">Every booking can be changed until the day before.</p>
    </main>
  </body>
</html>
